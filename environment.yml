# APEX-Mesh conda environment
name: APEX
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - cudatoolkit=11.6
  - plyfile
  - python=3.7.13
  - pip=22.3.1
  - pytorch=1.12.1
  - torchaudio=0.12.1
  - torchvision=0.13.1
  - tqdm
  # pip items (incl. local submodule builds) are installed after env creation; see scripts/setup_env.sh
